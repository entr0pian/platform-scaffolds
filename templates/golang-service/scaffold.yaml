name: golang-service
description: Minimal Go HTTP service scaffold — server skeleton, Dockerfile, Helm chart, and CI workflow.
version: 0.5.0

parameters:
  componentName:
    type: string
    required: true
    description: Component identity; used for the service/binary name, Helm chart name, and Kubernetes resource names.

  repositoryName:
    type: string
    required: true
    description: >-
      Name of the generated Git repository; used to derive the Go module path
      (github.com/{owner}/{repositoryName}) and, via values.yaml's default image
      repository, must match the GitHub repo name exactly. Must be lowercase — the CI
      workflow always publishes to a lowercased ghcr.io path, and an uppercase value
      here would make the chart's default image reference not match what CI actually
      pushed.

  owner:
    type: string
    required: true
    description: >-
      GitHub org or user the generated repository belongs to; also used in the Go
      module path. Must be lowercase, for the same reason as repositoryName above.

  componentOwner:
    type: string
    required: true
    description: >-
      Team responsible for the component (the platform Component's spec.owner) —
      distinct from `owner` above, which is the GitHub org/user the repository lives
      under. Used only for catalog-info.yaml's spec.owner.
