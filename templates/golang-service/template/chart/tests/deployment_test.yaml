suite: Deployment
templates:
  - templates/deployment.yaml
tests:
  - it: sets CPU and memory requests and limits by default
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources
          value:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi

  - it: takes resources from values
    set:
      resources.limits.memory: 512Mi
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 512Mi

  - it: runs two replicas by default
    asserts:
      - equal:
          path: spec.replicas
          value: 2

  - it: holds new pods Ready for minReadySeconds before counting them available
    asserts:
      - equal:
          path: spec.minReadySeconds
          value: 20

  - it: never drops below replicaCount ready pods during a rollout
    asserts:
      - equal:
          path: spec.strategy.rollingUpdate
          value:
            maxSurge: 1
            maxUnavailable: 0

  - it: gates traffic on /readyz and liveness on /healthz behind a startup probe
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /readyz
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /healthz
      - equal:
          path: spec.template.spec.containers[0].startupProbe
          value:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 2
            failureThreshold: 30

  - it: takes probe timings from values
    set:
      probes.readiness.periodSeconds: 15
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.periodSeconds
          value: 15

  - it: passes the landing page its environment, version and links
    set:
      image.tag: 0123456789abcdef0123456789abcdef01234567
      platform.component: svc
      platform.environment: dev
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: APP_VERSION
            value: 0123456789abcdef0123456789abcdef01234567
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PLATFORM_ENVIRONMENT
            value: dev
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PLATFORM_PORTAL_URL
            value: https://platform.gerodimos.dev/catalog/default/component/svc
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PLATFORM_DELIVERY_URL
            value: https://argocd.gerodimos.dev/applications/argocd/svc-dev

  - it: leaves platform links out outside the platform
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          any: true
          content:
            name: PLATFORM_PORTAL_URL
