{{- if .Values.bindings.database }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Chart.Name }}-binding-database
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: {{ .Chart.Name }}-binding-database
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ .Values.bindings.database.remoteRef }}
{{- end }}
