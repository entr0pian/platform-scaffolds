apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    {{- with .Values.platform.component }}
    platform.taskapp.io/component: {{ . | quote }}
    {{- end }}
    {{- with .Values.platform.environment }}
    platform.taskapp.io/environment: {{ . | quote }}
    {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  minReadySeconds: {{ .Values.minReadySeconds }}
  # Bring up a new pod and wait for it to be available before taking an old
  # one down, so a rollout never drops below replicaCount ready pods.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        {{- with .Values.platform.component }}
        platform.taskapp.io/component: {{ . | quote }}
        {{- end }}
        {{- with .Values.platform.environment }}
        platform.taskapp.io/environment: {{ . | quote }}
        {{- end }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.service.port }}
            {{- toYaml .Values.probes.startup | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.service.port }}
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ .Values.service.port }}
            {{- toYaml .Values.probes.readiness | nindent 12 }}
          # Shown on the landing page at /.
          env:
            - name: APP_VERSION
              value: {{ .Values.image.tag | quote }}
            {{- with .Values.platform.environment }}
            - name: PLATFORM_ENVIRONMENT
              value: {{ . | quote }}
            {{- end }}
            {{- if and .Values.platform.component .Values.platform.domain }}
            - name: PLATFORM_PORTAL_URL
              value: "https://platform.{{ .Values.platform.domain }}/catalog/default/component/{{ .Values.platform.component }}"
            {{- if .Values.platform.environment }}
            - name: PLATFORM_DELIVERY_URL
              value: "https://argocd.{{ .Values.platform.domain }}/applications/argocd/{{ .Values.platform.component }}-{{ .Values.platform.environment }}"
            {{- end }}
            {{- end }}
            {{- if .Values.bindings.database }}
            - name: SERVICE_BINDING_ROOT
              value: /bindings
            {{- end }}
        {{- if .Values.bindings.database }}
          volumeMounts:
            - name: binding-database
              mountPath: /bindings/database
              readOnly: true
        {{- end }}
      {{- if .Values.bindings.database }}
      volumes:
        - name: binding-database
          secret:
            secretName: {{ .Chart.Name }}-binding-database
      {{- end }}
